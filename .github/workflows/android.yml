name: "Build Dimasik APK"
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: "ubuntu-22.04"
    steps:
    - uses: "actions/checkout@v4"
    - uses: "actions/setup-java@v4"
      with:
        distribution: "temurin"
        java-version: "17"
    - run: "sudo apt-get update && sudo apt-get install -y libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good sqlite3 libsqlite3-dev python3-pip python3-virtualenv zip unzip && python3 -m pip install --upgrade pip && python3 -m pip install buildozer cython virtualenv"
    - run: "yes | buildozer android debug"
      env:
        ACCEPT_ANDROID_SDK_LICENSES: "y"
    - uses: "actions/upload-artifact@v4"
      with:
        name: "Dimasik-APK"
        path: "bin/*.apk"
